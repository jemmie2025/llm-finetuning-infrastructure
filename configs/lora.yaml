model:
  id: Qwen/Qwen3-1.7B
  method: lora
  quantization: null
  trust_remote_code: false

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

training:
  max_length: 512
  batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  epochs: 1
  max_steps: 20
  optimizer: adamw_torch
  precision: auto
  gradient_checkpointing: true
  seed: 42
  output_dir: outputs/lora
